<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Capture your thoughts quickly and keep your notes organized.</p>
        </div>
    </header>

    <main class="container">
        <section class="card" aria-labelledby="add-note-heading">
            <h2 id="add-note-heading">Add a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note</label>
                    <input
                        type="text"
                        id="note-input"
                        name="note"
                        placeholder="Write your note..."
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="category-select">Category</label>
                    <select id="category-select" name="category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" class="error-message" role="alert"></p>
        </section>

        <section class="card" aria-labelledby="your-notes-heading">
            <h2 id="your-notes-heading">Your notes</h2>

            <div class="search-group">
                <label for="search-input">Search notes</label>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search your notes..."
                >
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 QuickNotes. Built with HTML, CSS and JavaScript.</p>
        </div>
    </footer>
    <button id="clear-all-btn" type="button">Clear all</button>
</body>
</html>
